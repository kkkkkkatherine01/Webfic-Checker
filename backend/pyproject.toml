[project]
name = "webfic"
version = "0.1.0"
description = "Consistency checker for Chinese web novels"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "rich>=13.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "typer>=0.12",
]

[project.scripts]
webfic = "webfic.cli:app"
webfic-eval = "webfic.evaluation.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webfic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # full-width punctuation is expected in Chinese strings

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not a package
