# Development needs only Postgres (with pgvector for passage search). redis / api /
# worker / web come before launch.
services:
  postgres:
    image: pgvector/pgvector:pg16  # Postgres 16 plus the pgvector extension
    environment:
      POSTGRES_USER: webfic
      POSTGRES_PASSWORD: webfic
      POSTGRES_DB: webfic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webfic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
